<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Login</title>
<link rel="stylesheet" href="/styles.css">
</head>

<body>

<div class="form-wrap">

<div class="brand">TIMB3R</div>

<h1>Investor login</h1>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="btn"
onclick="login()">
Sign in
</button>

<div
id="status"
class="status">
</div>

</div>

<script>
async function login(){

  const response =
    await fetch(
      "/api/auth/login",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:
            document.getElementById("email").value,
          password:
            document.getElementById("password").value
        })
      }
    );

  const data =
    await response.json();

  if(!response.ok){
    document.getElementById("status")
      .textContent =
      data.error;
    return;
  }

  localStorage.setItem(
    "timb3rToken",
    data.token
  );

  if(
    data.user.role === "admin" ||
    data.user.role === "compliance"
  ){
    location.href =
      "/admin.html";
  }else{
    location.href =
      "/dashboard.html";
  }
}
</script>

</body>
</html>
