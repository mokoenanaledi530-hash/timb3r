<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Register</title>
<link rel="stylesheet" href="/styles.css">
</head>

<body>

<div class="form-wrap">

<div class="brand">TIMB3R</div>

<h1>Create account</h1>

<input
id="fullName"
placeholder="Full name">

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="btn"
onclick="register()">
Register
</button>

<div
id="status"
class="status">
</div>

</div>

<script>
async function register(){

  const response =
    await fetch(
      "/api/auth/register",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          fullName:
            document.getElementById("fullName").value,
          email:
            document.getElementById("email").value,
          password:
            document.getElementById("password").value
        })
      }
    );

  const data =
    await response.json();

  if(!response.ok){
    document.getElementById("status")
      .textContent =
      data.error;
    return;
  }

  localStorage.setItem(
    "timb3rToken",
    data.token
  );

  location.href =
    "/dashboard.html";
}
</script>

</body>
</html>
