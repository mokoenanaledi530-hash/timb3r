<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="/styles.css">
</head>

<body>

<nav class="main-nav">
<div class="brand">TIMB3R</div>

<div class="nav-links">
<a href="/dashboard.html">Dashboard</a>
<a href="/payment.html">Deposit</a>
<a href="/withdraw.html">Withdraw</a>
<a href="/bank-details.html">Bank Details</a>
<a href="/assistant.html">Assistant</a>
<a href="/transactions.html">Transactions</a>
<a href="#" onclick="logout()">Logout</a>
</div>
</nav>

<main class="container">

<h1>Investor Dashboard</h1>

<p id="user" class="small">
Loading...
</p>

<div class="balance-grid">

  <div class="balance-card">
    <span>Available balance</span>
    <strong id="availableBalance">R0.00</strong>
  </div>

  <div class="balance-card">
    <span>Invested</span>
    <strong id="investedBalance">R0.00</strong>
  </div>

  <div class="balance-card">
    <span>Returns</span>
    <strong id="returnsBalance">R0.00</strong>
  </div>

</div>

<div class="dashboard-actions">
  <a class="btn" href="/payment.html">Deposit funds</a>
  <a class="btn secondary-btn" href="/withdraw.html">Withdraw</a>
  <a class="btn secondary-btn" href="/transactions.html">Transactions</a>
</div>

<div class="card">
<h3>My referral link</h3>

<p class="small">
Share this link with people you refer.
</p>

<input
id="referralLink"
readonly>

<button
class="btn"
onclick="copyReferralLink()">
Copy referral link
</button>
</div>

<h2>Investment packages</h2>

<div
id="plans"
class="grid">
</div>

<h2>My investments</h2>

<div id="investments"></div>

</main>

<script>

const token =
localStorage.getItem("timb3rToken");

if(!token){
  location.href="/login.html";
}

function headers(){
  return {
    "Content-Type":"application/json",
    "Authorization":"Bearer "+token
  };
}

function planImage(name){
  const images = {
    "Starter Phase 1": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Pine%20forest%20in%20Sweden.jpg",
    "Starter Phase 2": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Tree%20plantation%20-%20geograph.org.uk%20-%20400838.jpg",
    "Starter Phase 3": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Tree%20planting%20Initiative%204.jpg",
    "Starter Phase 4": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Hafren%20Forest%20-%20geograph.org.uk%20-%201113858.jpg",
    "Starter Phase 5": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Forestry%20road%20and%20timber%2C%20Tywi%20Forest%2C%20Powys%20-%20geograph.org.uk%20-%201069273.jpg",
    "Timber Growth": "https://commons.wikimedia.org/wiki/Special:Redirect/file/130%20Blowndown%20timber%20and%20ash%20covered%20forest%20road%20%2836042492432%29.jpg",
    "Forest Builder": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Tree%20plantation%20-%20geograph.org.uk%20-%20400838.jpg",
    "Green Estate": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Hafren%20Forest%20-%20geograph.org.uk%20-%201113858.jpg",
    "Timber Reserve": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Forestry%20road%20and%20timber%2C%20Tywi%20Forest%2C%20Powys%20-%20geograph.org.uk%20-%201069273.jpg",
    "Forest Partner Plus": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Pine%20forest%20in%20Sweden.jpg"
  };

  return images[name] || "https://commons.wikimedia.org/wiki/Special:Redirect/file/Pine%20forest%20in%20Sweden.jpg";
}

async function load(){

  const meRes =
    await fetch(
      "/api/me",
      {headers:headers()}
    );

  if(meRes.status === 401){
    logout();
    return;
  }

  const me =
    await meRes.json();

  const dashboardRes =
    await fetch(
      "/api/dashboard",
      {headers:headers()}
    );

  if (dashboardRes.ok) {
    const balances =
      await dashboardRes.json();

    document.getElementById(
      "availableBalance"
    ).textContent =
      `R${Number(
        balances.available || 0
      ).toFixed(2)}`;

    document.getElementById(
      "investedBalance"
    ).textContent =
      `R${Number(
        balances.invested || 0
      ).toFixed(2)}`;

    document.getElementById(
      "returnsBalance"
    ).textContent =
      `R${Number(
        balances.returns || 0
      ).toFixed(2)}`;
  }

  document.getElementById("user")
    .textContent =
    `${me.name} • KYC ${me.kyc_status}`;

  document.getElementById(
    "referralLink"
  ).value =
    `${location.origin}/register.html?ref=${encodeURIComponent(
      me.referral_code
    )}`;

  const plansRes =
    await fetch(
      "/api/plans",
      {headers:headers()}
    );

  const plans =
    await plansRes.json();

  document.getElementById("plans")
    .innerHTML =
    plans.map(
      p => `
      <div class="card plan-card">

      <div class="plan-image">
        <img
          src="${planImage(p.name)}"
          alt="${p.name}"
          loading="lazy"
          referrerpolicy="no-referrer"
          onerror="this.src='https://commons.wikimedia.org/wiki/Special:Redirect/file/Pine%20forest%20in%20Sweden.jpg'">
      </div>

      <h3>${p.name}</h3>

      <strong>
      ${p.phase || ""}
      </strong>

      <p>
      ${p.description || ""}
      </p>

      <p>
      Minimum: R${p.min_amount}
      </p>

      <p>
      Term: ${p.term_days} days
      </p>

      <p class="daily-return">
      Daily return:
      <strong>
      ${
        p.daily_return_amount
          ? `R${Number(p.daily_return_amount).toFixed(2)} / day`
          : "Not set"
      }
      </strong>
      </p>

      <a
      class="btn"
      href="/purchase.html?plan=${encodeURIComponent(p.id)}">
      Buy package
      </a>

      <div
      id="status-${p.id}"
      class="status">
      </div>

      </div>
      `
    ).join("");

  loadInvestments();
}

async function invest(id){

  const amount =
    document.getElementById(
      `amount-${id}`
    ).value;

  const response =
    await fetch(
      "/api/investments",
      {
        method:"POST",
        headers:headers(),
        body:JSON.stringify({
          planId:id,
          amount:Number(amount)
        })
      }
    );

  const data =
    await response.json();

  document.getElementById(
    `status-${id}`
  ).textContent =
    response.ok
      ? "Application submitted"
      : data.error;

  if(response.ok){
    loadInvestments();
  }
}

async function loadInvestments(){

  const response =
    await fetch(
      "/api/investments",
      {headers:headers()}
    );

  const rows =
    await response.json();

  document.getElementById(
    "investments"
  ).innerHTML =
    rows.length
    ? rows.map(
      r => `
      <div class="card">
      <strong>
      ${r.name} ${r.phase || ""}
      </strong>
      <p>R${r.principal}</p>
      <p>Status: ${r.status}</p>
      </div>
      `
    ).join("")
    : `<div class="card">
       No investment applications yet.
       </div>`;
}

async function copyReferralLink(){
  const input =
    document.getElementById(
      "referralLink"
    );

  try {
    await navigator.clipboard.writeText(
      input.value
    );
  } catch (_) {
    input.select();
    document.execCommand("copy");
  }
}

function logout(){
  localStorage.removeItem(
    "timb3rToken"
  );

  location.href="/login.html";
}

load();

</script>

</body>
</html>
