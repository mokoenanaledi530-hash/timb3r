<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="/styles.css">
</head>

<body>

<nav>
<div class="brand">TIMB3R</div>
<a href="#" onclick="logout()">Logout</a>
</nav>

<main class="container">

<h1>Investor Dashboard</h1>

<p id="user" class="small">
Loading...
</p>

<h2>Investment packages</h2>

<div
id="plans"
class="grid">
</div>

<h2>My investments</h2>

<div id="investments"></div>

</main>

<script>

const token =
localStorage.getItem("timb3rToken");

if(!token){
  location.href="/login.html";
}

function headers(){
  return {
    "Content-Type":"application/json",
    "Authorization":"Bearer "+token
  };
}

async function load(){

  const meRes =
    await fetch(
      "/api/me",
      {headers:headers()}
    );

  if(meRes.status === 401){
    logout();
    return;
  }

  const me =
    await meRes.json();

  document.getElementById("user")
    .textContent =
    `${me.full_name} • KYC ${me.kyc_status}`;

  const plansRes =
    await fetch(
      "/api/plans",
      {headers:headers()}
    );

  const plans =
    await plansRes.json();

  document.getElementById("plans")
    .innerHTML =
    plans.map(
      p => `
      <div class="card plan-card">

      <div class="plan-image">
        <svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
          <rect width="640" height="320" fill="#173f2d"/>
          <circle cx="510" cy="72" r="42" fill="#d8b968"/>
          <path d="M0 220 L95 135 L175 220 L270 115 L360 220 L450 125 L560 220 L640 145 L640 320 L0 320 Z" fill="#2f6b47"/>
          <g fill="#8bc27c">
            <path d="M70 235 l35-86 35 86h-22v54H92v-54z"/>
            <path d="M165 245 l42-110 42 110h-26v55h-31v-55z"/>
            <path d="M290 240 l38-98 38 98h-24v60h-29v-60z"/>
            <path d="M410 245 l46-119 46 119h-28v55h-34v-55z"/>
            <path d="M535 238 l35-91 35 91h-22v62h-27v-62z"/>
          </g>
        </svg>
      </div>

      <h3>${p.name}</h3>

      <strong>
      ${p.phase || ""}
      </strong>

      <p>
      ${p.description || ""}
      </p>

      <p>
      Minimum: R${p.min_amount}
      </p>

      <p>
      Term: ${p.term_days} days
      </p>

      <input
      id="amount-${p.id}"
      type="number"
      placeholder="Amount">

      <button
      class="btn"
      onclick="invest(${p.id})">
      Apply
      </button>

      <div
      id="status-${p.id}"
      class="status">
      </div>

      </div>
      `
    ).join("");

  loadInvestments();
}

async function invest(id){

  const amount =
    document.getElementById(
      `amount-${id}`
    ).value;

  const response =
    await fetch(
      "/api/investments",
      {
        method:"POST",
        headers:headers(),
        body:JSON.stringify({
          planId:id,
          amount:Number(amount)
        })
      }
    );

  const data =
    await response.json();

  document.getElementById(
    `status-${id}`
  ).textContent =
    response.ok
      ? "Application submitted"
      : data.error;

  if(response.ok){
    loadInvestments();
  }
}

async function loadInvestments(){

  const response =
    await fetch(
      "/api/investments",
      {headers:headers()}
    );

  const rows =
    await response.json();

  document.getElementById(
    "investments"
  ).innerHTML =
    rows.length
    ? rows.map(
      r => `
      <div class="card">
      <strong>
      ${r.name} ${r.phase || ""}
      </strong>
      <p>R${r.principal}</p>
      <p>Status: ${r.status}</p>
      </div>
      `
    ).join("")
    : `<div class="card">
       No investment applications yet.
       </div>`;
}

function logout(){
  localStorage.removeItem(
    "timb3rToken"
  );

  location.href="/login.html";
}

load();

</script>

</body>
</html>
