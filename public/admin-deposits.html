<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Deposits</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<nav class="main-nav">
<div class="brand">TIMB3R ADMIN</div>
<div class="nav-links">
<a href="/admin.html">Overview</a>
<a href="/admin-investors.html">Investors</a>
<a href="/admin-investments.html">Investments</a>
<a href="/admin-withdrawals.html">Withdrawals</a>
<a href="#" onclick="logout()">Logout</a>
</div>
</nav>

<main class="container admin-page">

<h1>EFT Deposits</h1>

<p class="small">
Approve only after verifying the bank payment.
</p>

<div id="payments">Loading...</div>
<div id="status" class="status"></div>

</main>

<script src="/admin-common.js"></script>

<script>

async function load(){

try{

await requireAdmin();

const data=
await api(
"/api/admin/payments",
{headers:headers()}
);

const payments=data.payments || [];

document.getElementById("payments").innerHTML=

payments.length

? payments.map(p=>`
<div class="card admin-record">

<strong>
${esc(p.customer_name)}
</strong>

<p>
${esc(p.customer_email)}
</p>

<p>
Amount:
${money(p.amount)}
</p>

<p>
Reference:
${esc(p.profile_reference)}
</p>

<p>
Sender:
${esc(p.sender_name || "-")}
</p>

<p>
Bank:
${esc(p.sender_bank || "-")}
</p>

<p>
Status:
${esc(p.status)}
</p>

${p.proof_url
? `<p>
<a
href="${esc(p.proof_url)}"
target="_blank"
rel="noopener">
View proof of payment
</a>
</p>`
:""
}

${p.status==="pending"
? `
<div class="admin-actions">

<button
onclick="approvePayment('${p.id}')">
Approve EFT
</button>

<button
onclick="rejectPayment('${p.id}')">
Reject EFT
</button>

</div>
`
:""
}

</div>
`).join("")

:"<p>No EFT payments found.</p>";

}catch(err){

document.getElementById("status").textContent=
err.message;

}

}

async function approvePayment(id){

const note=
prompt(
"Admin note:",
"Bank EFT manually verified"
);

if(note===null)return;

try{

const data=
await api(
"/api/admin/payments/"+
encodeURIComponent(id)+
"/approve",
{
method:"POST",
headers:headers(true),
body:JSON.stringify({note})
}
);

alert(
data.message ||
"Payment approved"
);

await load();

}catch(err){

alert(err.message);

}

}

async function rejectPayment(id){

const note=
prompt(
"Reason for rejection:",
"Payment rejected"
);

if(note===null)return;

try{

const data=
await api(
"/api/admin/payments/"+
encodeURIComponent(id)+
"/reject",
{
method:"POST",
headers:headers(true),
body:JSON.stringify({note})
}
);

alert(
data.message ||
"Payment rejected"
);

await load();

}catch(err){

alert(err.message);

}

}

load();

</script>

</body>
</html>
