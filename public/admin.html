<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIMB3R Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .admin-label {
      font-size: 13px;
      opacity: .8;
      margin-top: 3px;
    }

    .logout {
      border: 0;
      background: #ef4444;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    aside {
      width: 230px;
      background: #1f2937;
      color: white;
      padding: 18px 12px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #d1d5db;
      text-align: left;
      padding: 13px 14px;
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: #374151;
      color: white;
    }

    main {
      flex: 1;
      padding: 24px;
      overflow-x: auto;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    h1 {
      margin-top: 0;
      font-size: 27px;
    }

    h2 {
      margin-top: 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .card-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 25px;
      font-weight: 800;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .approved,
    .completed,
    .verified {
      background: #dcfce7;
      color: #166534;
    }

    .rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: #f9fafb;
      font-size: 12px;
      text-transform: uppercase;
      color: #6b7280;
    }

    button.action {
      border: 0;
      border-radius: 7px;
      padding: 7px 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      margin: 2px;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .view {
      background: #e5e7eb;
      color: #
