<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Investments</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<nav class="main-nav">
<div class="brand">TIMB3R ADMIN</div>
<div class="nav-links">
<a href="/admin.html">Overview</a>
<a href="/admin-investors.html">Investors</a>
<a href="/admin-deposits.html">Deposits</a>
<a href="/admin-withdrawals.html">Withdrawals</a>
<a href="#" onclick="logout()">Logout</a>
</div>
</nav>

<main class="container admin-page">

<h1>Investments</h1>

<div id="investments">
Loading...
</div>

<div id="status" class="status"></div>

</main>

<script src="/admin-common.js"></script>

<script>

(async()=>{

try{

await requireAdmin();

const rows=
await api(
"/api/admin/investments",
{headers:headers()}
);

document.getElementById(
"investments"
).innerHTML=

rows.length

? rows.map(i=>`
<div class="card admin-record">

<strong>
${esc(i.investor_name)}
</strong>

<p>
${esc(i.investor_email)}
</p>

<p>
Package:
${esc(i.plan_name)}
</p>

<p>
Investment:
${money(i.principal)}
</p>

<p>
Daily return:
${i.daily_return_amount
? money(i.daily_return_amount)+" / day"
: "-"
}
</p>

<p>
Status:
${esc(i.status)}
</p>

<p>
Started:
${i.started_at
? new Date(i.started_at)
.toLocaleString("en-ZA")
: "-"
}
</p>

<p>
Maturity:
${i.maturity_at
? new Date(i.maturity_at)
.toLocaleString("en-ZA")
: "-"
}
</p>

</div>
`).join("")

:"<p>No investments found.</p>";

}catch(err){

document.getElementById(
"status"
).textContent=
err.message;

}

})();

</script>

</body>
</html>
